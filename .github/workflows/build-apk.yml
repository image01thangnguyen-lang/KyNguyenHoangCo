name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 🟢 Thiết lập Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Thiết lập Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🧪 Chạy kiểm thử tự động (Unit Tests)
        run: npm test

      - name: 📦 Đóng gói Web Assets cho Android APK
        run: node tools/build-apk-assets.ts

      - name: 🐘 Thiết lập Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 📱 Biên dịch Android APK
        run: |
          cd android
          gradle assembleDebug

      - name: 🚀 Xuất file cài đặt APK lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ky-nguyen-hoang-co-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
